# Publica somente a pasta do site. docs/ e .cursor/ ficam fora do ar.
[build]
  publish = "site"

[[redirects]]
  from = "/obrigado.html"
  to = "/obrigado/"
  status = 301

# www.nordetech.com.br abre o mesmo site no endereço principal.
[[redirects]]
  from = "https://www.nordetech.com.br/*"
  to = "https://nordetech.com.br/:splat"
  status = 301
  force = true
